const toXZPoly = (poly: LatLon[]) => poly.map(([la, lo]) => toXZ(la, lo));
const MAINLAND_XZ = toXZPoly(MAINLAND);
const LAKES_XZ = LAKES.map(toXZPoly);

function inPoly(x: number, z: number, poly: [number, number][]) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

function haversineKm([la1, lo1]: LatLon, [la2, lo2]: LatLon) {
  const r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(a));
}

// Seeded RNG so the forest looks the same every visit.
function rng(seed: number) {
  return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
}

const STOP_POS = STOPS.map(s => {
  const [x, z] = toXZ(s.lat, s.lon);
  return new THREE.Vector3(x + (s.nudge?.[0] ?? 0), H, z + (s.nudge?.[1] ?? 0));
});

const SPEED: Record<Vehicle, number> = { car: 2.2, van: 1.9, train: 3, tram: 0.8, metro: 0.8, moose: 2.4 };

const LEG_RT = LEGS.map((leg, i) => {
  const pts = [
    STOP_POS[i].clone(),
    ...leg.via.map(([la, lo]) => { const [x, z] = toXZ(la, lo); return new THREE.Vector3(x, H, z); }),
    STOP_POS[i + 1].clone(),
  ].map(p => p.setY(H + 0.06));
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const ll: LatLon[] = [[STOPS[i].lat, STOPS[i].lon], ...leg.via, [STOPS[i + 1].lat, STOPS[i + 1].lon]];
  const km = ll.slice(1).reduce((sum, p, j) => sum + haversineKm(ll[j], p), 0);
  const duration = THREE.MathUtils.clamp(curve.getLength() / SPEED[leg.vehicle], 2.8, 11);
  return { curve, km, duration };
});
const TOTAL_KM = LEG_RT.reduce((s, l) => s + l.km, 0);

/* ───────────────────────────── State ─────────────────────────────
   React state for things the UI shows; a mutable `live` object for
   per-frame values so we don't re-render 60×/s. */

const live = { progress: 0, vehiclePos: STOP_POS[0].clone() };
const rig = { wantDist: null as number | null, target: CENTER.clone() };

interface RunState {
  started: boolean;
  current: number;
  target: number;
  moving: boolean;
  legIdx: number;
  dir: 1 | -1;
  visited: boolean[];
  kmTotal: number;
  vehicle: Vehicle;
  overview: boolean;
  panelOpen: boolean;
  finaleSeen: boolean;
  showFinale: boolean;
  start: () => void;
  goTo: (i: number) => void;
  arrive: () => void;
  toggleOverview: () => void;
  setPanel: (open: boolean) => void;
  closeFinale: () => void;
}

const LAST = STOPS.length - 1;

const useRun = create<RunState>((set, get) => {
  const beginLeg = (from: number, to: number) => {
    const dir = to > from ? 1 : -1;
    const legIdx = dir > 0 ? from : from - 1;
    live.progress = 0;
    rig.wantDist = 17;
    set({ moving: true, dir, legIdx, vehicle: LEGS[legIdx].vehicle, panelOpen: false, overview: false });
  };
  return {
    started: false, current: 0, target: 0, moving: false, legIdx: 0, dir: 1,
    visited: STOPS.map(() => false), kmTotal: 0, vehicle: 'car', overview: true,
    panelOpen: false, finaleSeen: false, showFinale: false,
    start: () => {
      rig.wantDist = 11;
      set(s => ({ started: true, overview: false, panelOpen: true, visited: s.visited.map((v, i) => v || i === 0) }));
    },
    goTo: (i) => {
      const s = get();
      if (!s.started) return;
      set({ target: i, overview: false });
      if (s.moving) return; // picked up on arrival
      if (i === s.current) { rig.wantDist = 11; set({ panelOpen: true }); return; }
      beginLeg(s.current, i);
    },
    arrive: () => {
      const s = get();
      const next = s.current + s.dir;
      const visited = s.visited.map((v, i) => v || i === next);
      const kmTotal = s.kmTotal + LEG_RT[s.legIdx].km;
      if (next === s.target) {
        rig.wantDist = 11;
        const finale = next === LAST && !s.finaleSeen;
        set({ current: next, visited, kmTotal, moving: false, panelOpen: !finale, showFinale: finale, finaleSeen: s.finaleSeen || finale });
      } else {
        set({ current: next, visited, kmTotal });
        beginLeg(next, s.target);
      }
    },
    toggleOverview: () => {
      const overview = !get().overview;
      rig.wantDist = overview ? 82 : 11;
      set({ overview, panelOpen: !overview && !get().moving });
    },
    setPanel: (open) => set({ panelOpen: open }),
    closeFinale: () => set({ showFinale: false, panelOpen: true }),
  };
});

/* ───────────────────────────── 3D: world ───────────────────────────── */

const SAND = new THREE.Color('#e9d8a6');
const LAND_STOPS: [number, string][] = [[55, '#a6d86f'], [58, '#83c35c'], [61, '#5f9f4d'], [64, '#4c8746'], [66.5, '#8a9c7a'], [68.6, '#eef2ee']];

function landColor(lat: number, out: THREE.Color) {
  for (let i = 1; i < LAND_STOPS.length; i++) {
    if (lat <= LAND_STOPS[i][0] || i === LAND_STOPS.length - 1) {
      const [a, ca] = LAND_STOPS[i - 1], [b, cb] = LAND_STOPS[i];
      return out.set(ca).lerp(new THREE.Color(cb), THREE.MathUtils.clamp((lat - a) / (b - a), 0, 1));
    }
  }
  return out;
}

function shapeFrom(poly: LatLon[]) {
  const s = new THREE.Shape();
  poly.forEach(([la, lo], i) => { const [x, z] = toXZ(la, lo); i ? s.lineTo(x, -z) : s.moveTo(x, -z); });
  s.closePath();
  return s;
}

function makeLand(poly: LatLon[]) {
  const g = new THREE.ExtrudeGeometry(shapeFrom(poly), { depth: H, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    landColor(LAT0 - pos.getZ(i) / K, c);
    if (pos.getY(i) < H * 0.5) c.lerp(SAND, 0.9);
    c.toArray(col, i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

function makeLake(poly: LatLon[]) {
  const g = new THREE.ShapeGeometry(shapeFrom(poly));
  g.rotateX(-Math.PI / 2);
  return g;
}

function Land() {
  const geos = useMemo(() => [MAINLAND, GOTLAND, OLAND].map(makeLand), []);
  const lakes = useMemo(() => LAKES.map(makeLake), []);
  return (

}

function Forest() {
  const trees = useRef<THREE.InstancedMesh>(null!);
  const mounts = useRef<THREE.InstancedMesh>(null!);
  const caps = useRef<THREE.InstancedMesh>(null!);
  const { treeMats, mountMats, capMats, treeCols } = useMemo(() => {
    const rand = rng(42);
    const [minX, maxX] = [Math.min(...MAINLAND_XZ.map(p => p[0])), Math.max(...MAINLAND_XZ.map(p => p[0]))];
    const [minZ, maxZ] = [Math.min(...MAINLAND_XZ.map(p => p[1])), Math.max(...MAINLAND_XZ.map(p => p[1]))];
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
    const treeMats: THREE.Matrix4[] = [], treeCols: THREE.Color[] = [];
    const roadPts = LEG_RT.flatMap(l => l.curve.getPoints(60));
    for (let tries = 0; treeMats.length < 1100 && tries < 40000; tries++) {
      const x = minX + rand() * (maxX - minX), z = minZ + rand() * (maxZ - minZ);
      const lat = LAT0 - z / K;
      const density = lat < 57 ? 0.3 : lat < 66 ? 0.95 : 0.35;
      if (rand() > density || !inPoly(x, z, MAINLAND_XZ) || LAKES_XZ.some(l => inPoly(x, z, l))) continue;
      if (STOP_POS.some(sp => Math.hypot(sp.x - x, sp.z - z) < 0.7)) continue;
      if (roadPts.some(cp => Math.hypot(cp.x - x, cp.z - z) < 0.25)) continue;
      const h = 0.25 + rand() * 0.35;
      treeMats.push(m.compose(p.set(x, H, z), q.identity(), s.set(h * 0.55, h, h * 0.55)).clone());
      treeCols.push(c.setHSL(0.3 + rand() * 0.06, 0.45, lat > 66 ? 0.32 : 0.22 + rand() * 0.08).clone());
    }
    const mountMats: THREE.Matrix4[] = [], capMats: THREE.Matrix4[] = [];
    for (let lat = 62.2; lat < 68.9; lat += 0.22) {
      const j = BORDER.findIndex(b => b[0] < lat);
      if (j < 1) continue;
      const [la1, lo1] = BORDER[j - 1], [la2, lo2] = BORDER[j];
      const lon = lo2 + ((lat - la2) / (la1 - la2)) * (lo1 - lo2);
      for (let k = 0; k < 2; k++) {
        const [x, z] = toXZ(lat + (rand() - 0.5) * 0.2, lon + 0.5 + rand() * 1.4 + k * 0.9);
        if (!inPoly(x, z, MAINLAND_XZ)) continue;
        const hgt = 0.9 + rand() * 1.6 * (lat > 66 ? 1.3 : 1), r = 0.9 + rand() * 0.8;
        mountMats.push(m.compose(p.set(x, H, z), q.identity(), s.set(r, hgt, r)).clone());
        capMats.push(m.compose(p.set(x, H + hgt * 0.62, z), q.identity(), s.set(r * 0.38, hgt * 0.38, r * 0.38)).clone());
      }
    }
    return { treeMats, treeCols, mountMats, capMats };
  }, []);

  useLayoutEffect(() => {
    treeMats.forEach((m, i) => { trees.current.setMatrixAt(i, m); trees.current.setColorAt(i, treeCols[i]); });
    mountMats.forEach((m, i) => mounts.current.setMatrixAt(i, m));
    capMats.forEach((m, i) => caps.current.setMatrixAt(i, m));
    [trees, mounts, caps].forEach(r => { r.current.instanceMatrix.needsUpdate = true; });
    if (trees.current.instanceColor) trees.current.instanceColor.needsUpdate = true;
  }, [treeMats, mountMats, capMats, treeCols]);

  const cone = useMemo(() => new THREE.ConeGeometry(1, 1, 6).translate(0, 0.5, 0), []);
  const mountain = useMemo(() => new THREE.ConeGeometry(1, 1, 5).translate(0, 0.5, 0), []);
  return (
    <group>
      <instancedMesh ref={trees} args={[cone, undefined, treeMats.length]} castShadow receiveShadow>
        <meshStandardMaterial flatShading roughness={1} />
      </instancedMesh>
      <instancedMesh ref={mounts} args={[mountain, undefined, mountMats.length]} castShadow receiveShadow>
        <meshStandardMaterial color="#8d8f87" flatShading roughness={1} />
      </instancedMesh>
      <instancedMesh ref={caps} args={[mountain, undefined, capMats.length]}>
        <meshStandardMaterial color="#ffffff" flatShading roughness={0.8} />
      </instancedMesh>
    </group>
  );
}

function FalafelBalls({ count = 3 }: { count?: number }) {
  const spots: [number, number, number][] = [[-0.12, 0.1, 0.02], [0.13, 0.1, 0.05], [0, 0.11, -0.13], [0.02, 0.27, 0]];

}

function Marker({ i }: { i: number }) {
  const bob = useRef<THREE.Group>(null!);
  const ring = useRef<THREE.Mesh>(null!);
  const isCurrent = useRun(s => s.current === i && s.started);
  const visited = useRun(s => s.visited[i]);
  const goTo = useRun(s => s.goTo);
  const [hover, setHover] = useState(false);
  const p = STOP_POS[i];
  useFrame(({ clock }) => {
    const t = clock.elapsedTime;
    bob.current.position.y = H + 0.75 + Math.sin(t * 2 + i) * 0.08;
    bob.current.rotation.y = t * 0.7 + i;
    const k = THREE.MathUtils.lerp(bob.current.scale.x, hover || isCurrent ? 1.35 : 1, 0.15);
    bob.current.scale.setScalar(k);
    if (ring.current) {
      const f = (t * 0.7) % 1;
      ring.current.scale.setScalar(1 + f * 1.6);
      (ring.current.material as THREE.MeshBasicMaterial).opacity = 1 - f;
    }
  });
  useEffect(() => { document.body.style.cursor = hover ? 'pointer' : ''; }, [hover]);
  return (
    <group
      position={[p.x, 0, p.z]}
      onClick={(e: any) => { e.stopPropagation(); goTo(i); }}
      onPointerOver={(e: any) => { e.stopPropagation(); setHover(true); }}
      onPointerOut={() => setHover(false)}
    >
      <mesh position-y={H + 0.02} rotation-x={-Math.PI / 2} receiveShadow>
        <circleGeometry args={[0.32, 24]} />
        <meshStandardMaterial color={visited ? '#10b981' : '#fff7e6'} />
      </mesh>
      <mesh position-y={H + 0.38}>
        <cylinderGeometry args={[0.022, 0.022, 0.7, 6]} />
        <meshStandardMaterial color="#7c4a1d" />
      </mesh>
      <group ref={bob}>
        <mesh material={PITA_MAT} castShadow>
          <cylinderGeometry args={[0.32, 0.3, 0.06, 20]} />
        </mesh>
        <FalafelBalls count={visited ? 3 : 4} />
      </group>
      {isCurrent && (
        <mesh ref={ring} rotation-x={-Math.PI / 2} position-y={H + 0.03}>
          <ringGeometry args={[0.36, 0.44, 40]} />
          <meshBasicMaterial color="#f59e0b" transparent />
        </mesh>
      )}
    </group>
  );
}

const easeInOut = (t: number) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

function VehicleRig() {
  const g = useRef<THREE.Group>(null!);
  const type = useRun(s => s.vehicle);
  const tmp = useMemo(() => ({ p: new THREE.Vector3(), t: new THREE.Vector3() }), []);
  useFrame((_, dt) => {
    const s = useRun.getState();
    if (s.moving) {
      const leg = LEG_RT[s.legIdx];
      live.progress = Math.min(1, live.progress + dt / leg.duration);
      const e = easeInOut(live.progress);
      const u = s.dir > 0 ? e : 1 - e;
      leg.curve.getPointAt(u, tmp.p);
      leg.curve.getTangentAt(u, tmp.t);
      if (s.dir < 0) tmp.t.negate();
      g.current.position.copy(tmp.p);
      const yaw = Math.atan2(tmp.t.x, tmp.t.z);
      g.current.rotation.y += Math.atan2(Math.sin(yaw - g.current.rotation.y), Math.cos(yaw - g.current.rotation.y)) * 0.25;
      g.current.position.y = H + 0.04 + (type === 'moose' ? Math.abs(Math.sin(live.progress * 120)) * 0.03 : 0);
      live.vehiclePos.copy(g.current.position);
      if (live.progress >= 1) s.arrive();
    } else {
      const p = STOP_POS[s.current];
      g.current.position.set(p.x + 0.55, H + 0.04, p.z + 0.35);
      live.vehiclePos.copy(g.current.position);
    }
  });
  return <group ref={g}><VehicleModel type={type} /></group>;
}

function CameraRig() {
  const { camera, gl } = useThree();
  const controls = useMemo(() => {
    const c = new OrbitControls(camera, gl.domElement);
    c.enableDamping = true;
    c.dampingFactor = 0.08;
    c.maxPolarAngle = 1.2;
    c.minDistance = 3;
    c.maxDistance = 140;
    c.target.copy(CENTER);
    return c;
  }, [camera, gl]);
  useEffect(() => () => controls.dispose(), [controls]);
  const tmp = useMemo(() => ({ nt: new THREE.Vector3(), off: new THREE.Vector3() }), []);
  useFrame(() => {
    const s = useRun.getState();
    const desired = s.overview || !s.started ? CENTER : s.moving ? live.vehiclePos : STOP_POS[s.current];
    tmp.nt.copy(controls.target).lerp(desired, s.moving ? 0.12 : 0.06);
    camera.position.add(tmp.off.copy(tmp.nt).sub(controls.target));
    controls.target.copy(tmp.nt);
    if (rig.wantDist != null) {
      tmp.off.copy(camera.position).sub(controls.target);
      const len = tmp.off.length(), next = len + (rig.wantDist - len) * 0.05;
      camera.position.copy(controls.target).add(tmp.off.setLength(next));
      if (Math.abs(next - rig.wantDist) < 0.05) rig.wantDist = null;
    }
    rig.target.copy(controls.target);
    controls.update();
  });
  return null;
}

function Sun() {
  const light = useRef<THREE.DirectionalLight>(null!);
  const { scene } = useThree();
  useEffect(() => { scene.add(light.current.target); }, [scene]);
  useFrame(() => {
    light.current.position.set(rig.target.x + 9, 18, rig.target.z + 7);
    light.current.target.position.copy(rig.target);

  return (

    />
  );
}

const labelEls: (HTMLDivElement | null)[] = [];
const decoEls: (HTMLDivElement | null)[] = [];
const DECO_POS = DECO.map(d => { const [x, z] = toXZ(d.lat, d.lon); return new THREE.Vector3(x, H + 0.2, z); });

function LabelProjector() {
  const { camera, gl } = useThree();
  const v = useMemo(() => new THREE.Vector3(), []);
  useFrame(() => {
    camera.updateMatrixWorld();
    const size = { width: gl.domElement.clientWidth, height: gl.domElement.clientHeight };
    const place =(el: HTMLDivElement | null, p: THREE.Vector3, lift: number, minScale: number) => {
      if (!el) return;
      v.set(p.x, p.y + lift, p.z);
      const d = camera.position.distanceTo(v);
      v.project(camera);
      const visible = v.z < 1 && Math.abs(v.x) < 1.15 && Math.abs(v.y) < 1.15;
      el.style.display = visible ? '' : 'none';
      if (!visible) return;
      const scale = THREE.MathUtils.clamp(16 / d, minScale, 1.1);
      el.style.transform = `translate(${((v.x + 1) / 2) * size.width}px, ${((1 - v.y) / 2) * size.height}px) translate(-50%, -100%) scale(${scale})`;
      el.style.zIndex = String(1000 - Math.round(d));
    };
    STOP_POS.forEach((p, i) => place(labelEls[i], p, 1.15, 0.55));
    DECO_POS.forEach((p, i) => place(decoEls[i], p, 0, 0.6));
  });
  return null;
}

        </div>
      </div>
      <div className="flex shrink-0 flex-wrap items-center gap-2 border-t border-stone-900/10 bg-white/50 px-4 py-3">
        <Btn kind="ghost" href={mapsUrl(s)}>📸 Photos & map ↗</Btn>
        <div className="flex-1" />
        {current > 0 && <Btn kind="ghost" onClick={() => goTo(current - 1)}>←</Btn>}
        {current < LAST
          ? <Btn onClick={() => goTo(current + 1)}>Drive to {STOPS[current + 1].city === s.city ? STOPS[current + 1].name : STOPS[current + 1].city} →</Btn>
          : <Btn onClick={() => goTo(0)}>Drive back south ↩</Btn>}
      </div>
    </aside>
  );
}

function RouteList({ mobileOpen, onClose }: { mobileOpen: boolean; onClose: () => void }) {
  const { current, target, moving, visited, goTo, started } = useRun();
  return (
    <div className={`${mobileOpen ? 'block' : 'hidden'} pointer-events-auto absolute left-2 right-2 top-[68px] z-[2100] rounded-3xl bg-white/85 p-3 shadow-xl shadow-stone-900/10 ring-1 ring-stone-900/10 backdrop-blur md:left-4 md:right-auto md:top-[84px] md:block md:w-72`}>
      <div className="mb-1 flex items-center justify-between px-2">
        <div className="text-xs font-bold uppercase tracking-wider text-stone-500">The route · {Math.round(TOTAL_KM).toLocaleString('sv-SE')} km</div>
        <button className="text-stone-500 md:hidden" onClick={onClose} aria-label="Close route">✕</button>
      </div>
      <ol className="max-h-[46vh] space-y-0.5 overflow-y-auto">
        {STOPS.map((s, i) => {
          const here = started && i === current && !moving;
          const heading = moving && i === target;
          return (
            <li key={s.id}>
              <button
                disabled={!started}
                onClick={() => { goTo(i); onClose(); }}
                className={`flex w-full items-center gap-2.5 rounded-2xl px-2 py-1.5 text-left transition ${here ? 'bg-amber-100' : 'hover:bg-stone-100'} disabled:cursor-default`}
              >
                <span className={`grid h-7 w-7 shrink-0 place-items-center rounded-full text-xs font-bold ${visited[i] ? 'bg-emerald-500 text-white' : 'bg-stone-200 text-stone-600'}`}>
                  {visited[i] ? '✓' : i + 1}
                </span>
                <span className="min-w-0 flex-1">
                  <span className="block truncate text-sm font-semibold text-stone-800">{s.name}</span>
                  <span className="block truncate text-xs text-stone-500">{s.city} · {s.area}</span>
                </span>
                {here && <span className="text-lg">📍</span>}
                {heading && <span className="animate-wobble text-lg">{VEHICLE_INFO[LEGS[Math.min(i, LAST - 1)].vehicle].emoji}</span>}
              </button>
            </li>
          );
        })}
      </ol>
      <Passport />
    </div>
  );
}

function Passport() {
  const visited = useRun(s => s.visited);
  return (
    <div className="mt-2 border-t border-stone-900/10 px-2 pt-2">
      <div className="mb-1.5 text-xs font-bold uppercase tracking-wider text-stone-500">Falafel passport · {visited.filter(Boolean).length}/{STOPS.length}</div>
      <div className="flex flex-wrap gap-1.5">
        {STOPS.map((s, i) => (
          <div
            key={s.id}
            title={`${s.name}, ${s.city}`}
            style={{ ['--r' as any]: `${((i * 37) % 30) - 15}deg`, transform: `rotate(${((i * 37) % 30) - 15}deg)` }}
            className={`grid h-8 w-8 place-items-center rounded-full text-[15px] ${visited[i] ? 'animate-pop border-2 border-dashed border-chili bg-chili/10' : 'border-2 border-dashed border-stone-300 text-stone-300'}`}
          >
            {visited[i] ? '🧆' : '·'}
          </div>
        ))}
      </div>
    </div>
  );
}

function Hud() {
  const { moving, legIdx, dir, current, vehicle } = useRun();
  const [p, setP] = useState(0);
  useEffect(() => {
    if (!moving) return;
    const id = setInterval(() => setP(live.progress), 100);
    return () => clearInterval(id);
  }, [moving]);
  if (!moving) return null;
  const leg = LEGS[legIdx], rt = LEG_RT[legIdx];
  const from = STOPS[current], to = STOPS[current + dir];
  const chatter = (dir > 0 ? leg.chatter : [...leg.chatter].reverse())[Math.min(leg.chatter.length - 1, Math.floor(p * leg.chatter.length))];
  const v = VEHICLE_INFO[vehicle];
  return (
    <div className="animate-slide-in pointer-events-none absolute bottom-4 left-1/2 z-[2000] w-[min(94vw,540px)] -translate-x-1/2 rounded-3xl bg-stone-900/85 p-4 text-white shadow-2xl backdrop-blur">
      <div className="flex items-center gap-3">
        <div className="animate-wobble text-4xl">{v.emoji}</div>
        <div className="min-w-0 flex-1">
          <div className="text-xs font-semibold uppercase tracking-wider text-amber-300">{v.label}</div>
          <div className="truncate font-display text-lg font-semibold">{from.city === to.city ? `${from.name} → ${to.name}` : `${from.city} → ${to.city}`}</div>
        </div>
        <div className="text-right font-display tabular-nums">
          <div className="text-2xl font-bold">{Math.round(rt.km * p)}</div>
          <div className="text-[11px] text-stone-300">of {Math.round(rt.km)} km</div>
        </div>
      </div>
      <div className="mt-3 h-2 overflow-hidden rounded-full bg-white/15">
        <div className="h-full rounded-full bg-gradient-to-r from-amber-400 to-chili" style={{ width: `${p * 100}%` }} />
      </div>
      <div className="mt-2 text-sm text-stone-200">“{chatter}”</div>
    </div>
  );
}

function StopLabels() {
  const { current, visited, goTo, started, moving } = useRun();
  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden">
      {DECO.map((d, i) => (
        <div key={d.name} ref={el => { decoEls[i] = el; }} className="absolute left-0 top-0 origin-bottom whitespace-nowrap will-change-transform">
          <span className={d.kind === 'country' ? 'font-display text-lg font-semibold tracking-[0.3em] text-sky-900/40' : 'text-[11px] font-semibold text-stone-700/60'}>
            {d.kind === 'city' && '• '}{d.name}
          </span>
        </div>
      ))}
      {STOPS.map((s, i) => {
        const here = started && i === current && !moving;
        return (
          <div key={s.id} ref={el => { labelEls[i] = el; }} className="absolute left-0 top-0 origin-bottom will-change-transform">
            <button
              onClick={() => goTo(i)}
              className={`pointer-events-auto flex items-center gap-1.5 whitespace-nowrap rounded-full py-1 pl-1 pr-3 text-xs font-semibold shadow-lg ring-1 transition hover:scale-105 ${
                here ? 'bg-crust text-white ring-crust' : 'bg-white/90 text-stone-800 ring-stone-900/10'
              }`}
            >
              <span className={`grid h-5 w-5 place-items-center rounded-full text-[10px] ${here ? 'bg-white text-crust' : visited[i] ? 'bg-emerald-500 text-white' : 'bg-stone-200 text-stone-600'}`}>
                {visited[i] ? '✓' : i + 1}
              </span>
              {s.name}
            </button>
          </div>
        );
      })}
    </div>
  );
}

function Intro() {
  const { started, start } = useRun();
  if (started) return null;
  return (
    <div className="pointer-events-auto absolute inset-0 z-[3000] grid place-items-center bg-sky-950/20 p-4 backdrop-blur-[2px]">
      <div className="animate-slide-in w-full max-w-lg rounded-[2rem] bg-tahini p-7 text-center shadow-2xl ring-1 ring-stone-900/10">
        <div className="text-6xl">🧆</div>
        <h1 className="mt-2 font-display text-4xl font-bold text-stone-900 sm:text-5xl">Falafel Run</h1>
        <div className="font-display text-lg font-semibold text-crust">Sverige edition · Malmö → Umeå</div>
        <p className="mt-4 text-[15px] leading-relaxed text-stone-700">
          {STOPS.length} of the best-rated falafel spots on the web. One country. Around {Math.round(TOTAL_KM / 10) * 10} km of chickpeas (and one round of fava beans).
          You'll travel by car, train, tram, falafel van and, for the last leg, moose.
        </p>
        <div className="mt-4 grid grid-cols-3 gap-2 text-xs text-stone-600">
          <div className="rounded-2xl bg-white/70 p-2"><div className="text-lg">🖱️</div>Drag to orbit, scroll to zoom</div>
          <div className="rounded-2xl bg-white/70 p-2"><div className="text-lg">🧆</div>Click any stop to drive there</div>
          <div className="rounded-2xl bg-white/70 p-2"><div className="text-lg">⌨️</div>← → to drive, O for overview</div>
        </div>
        <button onClick={start} className="mt-6 w-full rounded-full bg-crust px-6 py-3.5 font-display text-xl font-semibold text-white shadow-lg shadow-crust/30 transition hover:bg-[#82491a] active:scale-[.98]">
          Start the engine 🚗
        </button>
        <p className="mt-4 text-[11px] leading-snug text-stone-500">
          Ratings come from the linked sources (Dagens PS composites, Google via aggregators, HappyCow, The Local and others). Review lines are paraphrased.
          Researched Oct 2026; places and opening hours change, so check before you go.
        </p>
      </div>
    </div>
  );
}

function Finale() {
  const { showFinale, closeFinale, kmTotal, visited, toggleOverview } = useRun();
  if (!showFinale) return null;
  const n = visited.filter(Boolean).length;
  return (
    <div className="pointer-events-auto absolute inset-0 z-[3000] grid place-items-center bg-sky-950/25 p-4 backdrop-blur-[2px]">
      <div className="animate-slide-in w-full max-w-md rounded-[2rem] bg-tahini p-7 text-center shadow-2xl ring-1 ring-stone-900/10">
        <div className="text-6xl">🏁🫎🧆</div>
        <h2 className="mt-2 font-display text-4xl font-bold text-stone-900">Du klarade det!</h2>
        <p className="mt-1 text-stone-600">You reached the northernmost falafel on the route.</p>
        <div className="mt-5 grid grid-cols-3 gap-2">
          {[[Math.round(kmTotal).toLocaleString('sv-SE'), 'km travelled'], [`${n}/${STOPS.length}`, 'stops'], [n * 3, 'falafels (est.)']].map(([v, l]) => (
            <div key={l} className="rounded-2xl bg-white/80 p-3">
              <div className="font-display text-2xl font-bold text-crust">{v}</div>
              <div className="text-xs text-stone-500">{l}</div>
            </div>
          ))}
        </div>
        <div className="mt-6 flex flex-col gap-2 sm:flex-row">
          <Btn kind="ghost" className="flex-1" onClick={() => { closeFinale(); toggleOverview(); }}>🗺️ See the whole route</Btn>
          <Btn className="flex-1" onClick={closeFinale}>Eat at King 🧆</Btn>
        </div>
      </div>
    </div>
  );
}

function TopBar({ onRoute }: { onRoute: () => void }) {
  const { overview, toggleOverview, started, panelOpen, moving, setPanel } = useRun();
  return (
    <div className="pointer-events-none absolute inset-x-0 top-0 z-[2200] flex items-start justify-between gap-2 p-2 md:p-4">
      <div className="pointer-events-auto flex items-center gap-2 rounded-full bg-white/85 py-1.5 pl-2 pr-4 shadow-lg ring-1 ring-stone-900/10 backdrop-blur">
        <span className="text-2xl">🧆</span>
        <div className="leading-none">
          <div className="font-display text-lg font-bold text-stone-900">Falafel Run</div>
          <div className="text-[11px] font-semibold text-crust">Sverige edition</div>
        </div>
      </div>
      {started && (
        <div className="pointer-events-auto flex gap-2">
          <button onClick={onRoute} className="rounded-full bg-white/85 px-3.5 py-2 text-sm font-semibold text-stone-800 shadow-lg ring-1 ring-stone-900/10 backdrop-blur md:hidden">☰ Route</button>
          {!panelOpen && !moving && !overview && (
            <button onClick={() => setPanel(true)} className="rounded-full bg-white/85 px-3.5 py-2 text-sm font-semibold text-stone-800 shadow-lg ring-1 ring-stone-900/10 backdrop-blur">ℹ️ Info</button>
          )}
          <button onClick={toggleOverview} className={`rounded-full px-3.5 py-2 text-sm font-semibold shadow-lg ring-1 backdrop-blur ${overview ? 'bg-crust text-white ring-crust' : 'bg-white/85 text-stone-800 ring-stone-900/10'}`}>
            🗺️ {overview ? 'Back to stop' : 'Overview'}
          </button>
        </div>
      )}
    </div>
  );
}

/* ───────────────────────────── App ───────────────────────────── */

function App() {
  const [routeOpen, setRouteOpen] = useState(false);
  useEffect(() => {
    // Deep links: #stop=4 jumps straight to a stop, #overview shows the whole map.
    const m = location.hash.match(/stop=(\d+)/);
    if (m) {
      const n = THREE.MathUtils.clamp(+m[1] - 1, 0, LAST);
      rig.wantDist = 11;
      useRun.setState({ started: true, overview: false, current: n, target: n, panelOpen: true, visited: STOPS.map((_, i) => i <= n) });
      if (location.hash.includes('go')) setTimeout(() => useRun.getState().goTo(Math.min(LAST, n + 1)), 800);
    } else if (location.hash.includes('overview')) {
      useRun.getState().start();
      useRun.getState().toggleOverview();
    }
  }, []);
  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      const s = useRun.getState();
      if (!s.started) { if (e.key === 'Enter') s.start(); return; }
      if (e.key === 'ArrowRight') s.goTo(Math.min(LAST, (s.moving ? s.target : s.current) + 1));
      else if (e.key === 'ArrowLeft') s.goTo(Math.max(0, (s.moving ? s.target : s.current) - 1));
      else if (e.key.toLowerCase() === 'o') s.toggleOverview();
      else if (e.key === 'Escape') s.setPanel(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return (
    <div className="relative h-full w-full overflow-hidden font-sans select-none">
      <Canvas shadows dpr={[1, 2]} camera={{ position: [CENTER.x, 62, CENTER.z + 52], fov: 42, near: 0.1, far: 600 }}>
        <Scene />
      </Canvas>
      <StopLabels />
      <TopBar onRoute={() => setRouteOpen(o => !o)} />
      {useRun(s => s.started) && <RouteList mobileOpen={routeOpen} onClose={() => setRouteOpen(false)} />}
      <StopPanel />
      <Hud />
      <Intro />
      <Finale />
    </div>
  );
}

createRoot(document.getElementById('root')!).render(<App />);
</script>
</body>
</html>
